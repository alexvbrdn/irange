name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test with default features
        run: cargo test --all-targets

      - name: Test with no default features
        run: cargo test --no-default-features --all-targets

      - name: Test with all features
        run: cargo test --all-features --all-targets

      # `--all-targets` skips doctests, and the crate documentation is full of them.
      - name: Doctests
        run: cargo test --all-features --doc

  cross:
    name: 32-bit target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      # 32-bit libc, both to link the test binaries and to build criterion's `alloca`,
      # whose build script compiles C.
      - name: Install the 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # `usize` and `isize` are the only types in the public API whose width depends on
      # the platform, and every other job runs on a 64-bit one.
      - name: Test on a 32-bit target
        run: cargo test --all-features --target i686-unknown-linux-gnu

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      # Nightly with `--cfg docsrs`, to match how docs.rs builds the crate.
      - name: Build documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.63
      - uses: Swatinem/rust-cache@v2

      # The dev-dependencies need a far newer compiler than the crate itself, and Cargo
      # resolves them even when nothing that uses them is being built, so they have to be
      # gone before the lockfile is written. `cargo hack --no-dev-deps` cannot do this:
      # it generates the lockfile before it edits the manifest.
      - name: Drop the dev-dependencies
        run: |
          awk '/^\[/ { skip = ($0 == "[dev-dependencies]") } !skip' Cargo.toml > Cargo.toml.msrv
          mv Cargo.toml.msrv Cargo.toml

      # The `serde` feature is excluded for the same reason: it pulls in `serde_derive`,
      # whose own dependencies raise the requirement past 1.63. This is what the README
      # documents. `--all-targets` is omitted so the bench, which needs criterion, is not
      # built.
      - name: Check against the declared MSRV
        run: cargo check --no-default-features

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dry-run publish
        run: cargo publish --dry-run
